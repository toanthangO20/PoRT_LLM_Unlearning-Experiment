[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-port"
version = "0.1.0"
description = "SAFE-PoRT: adapter unlearning plus post-judgment routing for hazardous-knowledge LLM unlearning"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "PoRT LLM Unlearning Experiment" }
]
dependencies = [
  "torch>=2.1",
  "transformers>=4.40",
  "datasets>=2.18",
  "accelerate>=0.28",
  "peft>=0.10",
  "pandas>=2.0",
  "numpy>=1.24",
  "tqdm>=4.66",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "pyarrow>=14.0",
  "sentencepiece>=0.1.99"
]

[project.scripts]
safe-port = "safe_port.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

